services:
  postgres:
    image: postgres:16-alpine
    container_name: grantcrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grantcrm
      POSTGRES_USER: grantcrm
      POSTGRES_PASSWORD: grantcrm_password
    ports:
      - "5432:5432"
    volumes:
      - grantcrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantcrm -d grantcrm"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: node:20-alpine
    container_name: grantcrm_app
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run setup && npm start"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://grantcrm:grantcrm_password@postgres:5432/grantcrm
      AI_PROVIDER: ${AI_PROVIDER:-fallback}
      AI_MODEL: ${AI_MODEL:-local-fallback}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CUSTOM_AI_BASE_URL: ${CUSTOM_AI_BASE_URL:-}
      CUSTOM_AI_API_KEY: ${CUSTOM_AI_API_KEY:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.3}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1400}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  grantcrm_pgdata:
