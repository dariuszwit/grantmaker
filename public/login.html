<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Grant CRM — Logowanie</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --panel:#ffffff;
      --line:#dce4ef;
      --text:#172033;
      --muted:#65728b;
      --accent:#2f6fed;
      --shadow:0 8px 28px rgba(21,35,58,.10);
      --radius:18px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:linear-gradient(135deg,#f4f7fb 0%,#eaf1ff 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Arial,sans-serif;
      color:var(--text);
    }
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      width:100%;
      max-width:380px;
      padding:40px 36px;
    }
    .brand{font-size:22px;font-weight:850;letter-spacing:-.03em;margin-bottom:4px}
    .brand span{color:var(--accent)}
    .sub{color:var(--muted);font-size:12px;margin-bottom:32px}
    label{
      display:block;
      font-size:11px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:700;
      margin-bottom:6px;
      margin-top:18px;
    }
    input{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 13px;
      font:inherit;
      color:var(--text);
      background:#fff;
      outline:none;
      transition:border-color .15s,box-shadow .15s;
    }
    input:focus{border-color:#9fbaf7;box-shadow:0 0 0 4px rgba(47,111,237,.10)}
    .btn{
      width:100%;
      margin-top:28px;
      padding:11px;
      background:var(--accent);
      color:#fff;
      border:none;
      border-radius:12px;
      font:inherit;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      transition:background .15s,transform .12s;
    }
    .btn:hover{background:#245ed0;transform:translateY(-1px)}
    .btn:active{transform:none}
    .btn:disabled{opacity:.7;cursor:default;transform:none}
    .error{
      margin-top:14px;
      padding:10px 13px;
      background:#fff5f7;
      border:1px solid #f2c7cf;
      border-radius:10px;
      color:#8e1f32;
      font-size:12px;
      display:none;
    }
    .error.show{display:block}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Grant<span>CRM</span></div>
    <div class="sub">360 AI &mdash; zaloguj się aby kontynuować</div>
    <form id="form">
      <label for="username">Użytkownik</label>
      <input id="username" name="username" type="text" autocomplete="username" required placeholder="admin"/>
      <label for="password">Hasło</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required/>
      <button class="btn" type="submit" id="btn">Zaloguj się</button>
      <div class="error" id="err"></div>
    </form>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('err');
      const btn = document.getElementById('btn');
      err.className = 'error';
      btn.disabled = true;
      btn.textContent = '...';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await r.json();
        if (r.ok) {
          window.location.href = '/';
        } else {
          err.textContent = data.error || 'Błąd logowania';
          err.className = 'error show';
        }
      } catch {
        err.textContent = 'Błąd połączenia z serwerem';
        err.className = 'error show';
      }
      btn.disabled = false;
      btn.textContent = 'Zaloguj się';
    });
  </script>
</body>
</html>
